# qlane test target: builds THIS repository's Vikunja source (qlane/Dockerfile: the Go API with the Vue
# frontend embedded) on Postgres, in an ephemeral sandbox. Sandboxes are discarded after each run and
# unreachable externally. Nothing in the running stack reaches the network: no license key (free mode, so the
# license server is never called), no mailer, initials avatars, no external auth.
# Docs: https://docs.qlane.ai/connect/docker-compose

services:
  vikunja:
    image: vikunja-qlane:local
    pull_policy: build
    build:
      context: .
      dockerfile: qlane/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3456:3456"
    environment:
      # Service wiring: throwaway values for this ephemeral stack.
      - VIKUNJA_DATABASE_TYPE=postgres
      - VIKUNJA_DATABASE_HOST=db
      - VIKUNJA_DATABASE_DATABASE=vikunja
      - VIKUNJA_DATABASE_USER=vikunja
      - VIKUNJA_DATABASE_PASSWORD=qlane-vikunja-db
      - VIKUNJA_SERVICE_PUBLICURL=${QLANE_SANDBOX_PUBLIC_URL:-http://localhost:3456}
      # This deployment's choices: what is switched on and off.
      - VIKUNJA_SERVICE_ENABLEREGISTRATION=true
      - VIKUNJA_MAILER_ENABLED=false
      - VIKUNJA_DEFAULTSETTINGS_AVATAR_PROVIDER=initials
      # The QA accounts' passwords come from the test target's variables (see .env.example); the stack refuses to
      # start without them. The postdeploy hook below reads them from this environment, inside the container.
      - QA_ADMIN_PASSWORD=${QA_ADMIN_PASSWORD:?Set QA_ADMIN_PASSWORD on the test target}
      - QA_USER_PASSWORD=${QA_USER_PASSWORD:?Set QA_USER_PASSWORD on the test target}
    healthcheck:
      test: ["CMD", "/app/vikunja/vikunja", "healthcheck"]
      start_period: 60s
      timeout: 5s
      interval: 10s
      retries: 20
    labels:
      # Creates the two QA accounts once (qlane/seed-users.sh, inside the image). The script reads the passwords
      # from this container's environment, so the label carries no `$`: the hook runs the label's text as the
      # compose configuration prints it, where `$$` stays `$$`.
      ai.qlane.postdeploy: qlane-seed-users
    volumes:
      - vikunja-files:/app/vikunja/files

  db:
    image: docker.io/postgres:17-alpine
    environment:
      - POSTGRES_DB=vikunja
      - POSTGRES_USER=vikunja
      - POSTGRES_PASSWORD=qlane-vikunja-db
    healthcheck:
      test: pg_isready -q -t 2 -d $$POSTGRES_DB -U $$POSTGRES_USER
      start_period: 20s
      timeout: 30s
      interval: 10s
      retries: 5
    volumes:
      - vikunja-postgres:/var/lib/postgresql/data

volumes:
  vikunja-files:
  vikunja-postgres:
